name: CI — Zephyr C11 & Fault Harness

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  c11-build-and-asan:
    name: ⚙️ C11 Strict Build + ASan/UBSan Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC & CMake
        run: sudo apt-get update && sudo apt-get install -y gcc cmake make

      - name: Compile C11 Driver & Execute Sanitizers (ASan + UBSan)
        run: make test

      - name: Verify CMake Out-of-Tree Static Library Build
        run: |
          mkdir -p build_cmake && cd build_cmake
          cmake .. && make -j$(nproc)
          ctest --output-on-failure

  python-harness-tests:
    name: 🧪 Python CAN Fault Harness (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest

      - name: Run 5-stage simulation suite
        run: python -m pytest tests/ -v
